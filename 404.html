<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halaman tidak ditemukan — Skyseed Isles</title>
<meta name="robots" content="noindex">
<style>
  :root { --ink:#1d3a5f; --muted:#5b6b82; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(180deg,#8fd0f5 0%,#cfeafa 60%,#e8f6d8 100%);
  }
  .card {
    background:#fffdf5; border-radius:22px; padding:32px 26px; max-width:440px; width:100%;
    box-shadow:0 18px 50px rgba(20,40,80,.25);
  }
  .em { font-size:56px; line-height:1; margin-bottom:10px; }
  h1 { font-size:22px; margin:0 0 10px; }
  p { font-size:15px; color:var(--muted); line-height:1.55; margin:0 0 22px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  a {
    display:inline-flex; align-items:center; justify-content:center;
    min-height:48px; padding:12px 20px; border-radius:14px;
    font-weight:700; font-size:15px; text-decoration:none;
  }
  .go { color:#fff; background:linear-gradient(135deg,#8fd0f5,#a06bf0); }
  .back { color:var(--ink); background:#eef3f9; border:1.5px solid #d9e3ee; }
  a:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
</style>
</head>
<body>
  <main class="card">
    <div class="em" aria-hidden="true">🪁</div>
    <h1>Wah, pulau ini belum ada</h1>
    <p>Halaman yang kamu cari tidak ketemu. Mungkin alamatnya salah ketik sedikit. Tenang, dunianya masih di sana kok.</p>
    <div class="row">
      <a class="go" href="/play/">Main sekarang</a>
      <a class="back" href="/">Kembali ke depan</a>
    </div>
  </main>
</body>
</html>
